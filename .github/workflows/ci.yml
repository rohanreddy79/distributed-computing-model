name: CI

on:
  push:
  pull_request:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Gossip_Algorithm/Gossip_Algorithm.fsproj -c Release

      - name: Run every topology with both protocols
        shell: bash
        run: |
          run() {
            echo "--- dotnet run -- $*"
            timeout 60 dotnet run --project Gossip_Algorithm -c Release --no-build -- "$@" </dev/null | tee -a run.log
          }
          run 100 full gossip
          run 100 full push-sum
          run 20 line gossip
          run 20 line push-sum
          run 11 2D gossip        # 11 is not a perfect square: exercises the partial-grid wiring
          run 11 2D push-sum
          run 30 Imp3D gossip
          run 30 Imp3D push-sum

      - name: Check that all eight runs converged
        run: test "$(grep -c 'Time for convergence' run.log)" -eq 8
